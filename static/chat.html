<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zorya · Chat</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    /* Pinned synthetic thread for the MCP connector URL.
       Lives below the regular thread list, sticky at the bottom of the sidebar. */
    .thread-list-pinned {
      padding: 0.6rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(167, 139, 250, 0.04);
    }
    .thread-list-pinned[hidden] { display: none; }
    .thread-item-pinned {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      background: rgba(167, 139, 250, 0.12);
      border: 1px solid rgba(167, 139, 250, 0.3);
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
      color: rgba(255, 255, 255, 0.92);
    }
    .thread-item-pinned:hover {
      background: rgba(167, 139, 250, 0.22);
      border-color: rgba(167, 139, 250, 0.5);
    }
    .thread-item-pinned.active {
      background: rgba(167, 139, 250, 0.28);
      border-color: rgba(167, 139, 250, 0.6);
    }
    .thread-pin-icon {
      width: 16px; height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent, #a78bfa);
    }
    .thread-pin-title { flex: 1; font-weight: 500; }
    .thread-pin-status {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.55);
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .thread-pin-status.online {
      color: #86efac;
      border-color: rgba(74, 222, 128, 0.35);
      background: rgba(74, 222, 128, 0.12);
    }
    .thread-pin-status.offline {
      color: rgba(255, 255, 255, 0.45);
    }
    /* Read-only state for the input form when the MCP thread is active */
    body.mcp-thread-active .chat-input {
      opacity: 0.45;
      pointer-events: none;
    }
    /* Inline copy button inside the MCP synthetic message */
    .mcp-copy-btn {
      display: inline-block;
      margin-left: 0.5rem;
      padding: 1px 9px;
      font: inherit;
      font-size: 0.78rem;
      border-radius: 6px;
      border: 1px solid rgba(167, 139, 250, 0.55);
      background: rgba(167, 139, 250, 0.22);
      color: #fff;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }
    .mcp-copy-btn:hover { background: rgba(167, 139, 250, 0.4); }
    .mcp-copy-btn.copied {
      background: rgba(74, 222, 128, 0.4);
      border-color: rgba(74, 222, 128, 0.7);
    }
  </style>
</head>
<body>
  <div class="chat-app">

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Conversations</h2>
        <div class="sidebar-actions">
          <button class="btn-new" id="new-thread" title="New conversation">+ New</button>
          <button class="btn-icon" id="sidebar-toggle" title="Collapse sidebar" aria-label="Collapse sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="thread-list" id="thread-list">
        <div class="thread-list-empty">No conversations yet.</div>
      </div>
      <div class="thread-list-pinned" id="thread-list-pinned" hidden></div>
    </aside>

    <section class="chat-pane">
      <header class="chat-header">
        <button class="btn-icon sidebar-expand" id="sidebar-expand" title="Open sidebar" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
        <h1>Chat</h1>
        <div class="chat-header-controls">
          <label class="pill pill-select" title="Text model (OpenAI) — used for text-only messages">
            <select id="model" disabled><option>loading…</option></select>
          </label>
          <label class="pill pill-select" title="Vision model (Anthropic) — used when an image is attached">
            <select id="vision-model"></select>
          </label>
        </div>
      </header>
      <div class="chat-log" id="log-left" aria-live="polite"></div>
    </section>

    <section class="chat-pane">
      <header class="chat-header">
        <h1>Translated</h1>
        <label class="pill pill-select" title="Target language">
          <select id="lang" disabled><option>loading…</option></select>
        </label>
      </header>
      <div class="chat-log" id="log-right" aria-live="polite"></div>
    </section>

    <form class="chat-input" id="form">
      <button type="button" id="attach-btn" class="btn-attach" title="Attach image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 1 1-8.49-8.49l9.19-9.19a4 4 0 1 1 5.66 5.66l-9.2 9.19a2 2 0 1 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <input type="file" id="image-input" accept="image/*" hidden>
      <div id="image-preview" class="image-preview" hidden>
        <img id="image-preview-img" alt="attachment preview">
        <button type="button" id="image-clear" class="image-clear" title="Remove attachment">×</button>
      </div>
      <textarea
        id="input"
        placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
        autocomplete="off"
        autofocus
      ></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </div>

  <button class="bg-toggle" id="bg-toggle" title="Change background">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17c2.8 0 5-2.2 5-5 0-4.9-4.5-9-10-9z"/>
      <circle cx="7.5" cy="11.5" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="11" cy="6.5" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="16" cy="7.5" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="17.5" cy="12.5" r="1.2" fill="currentColor" stroke="none"/>
    </svg>
  </button>
  <div class="bg-toast" id="bg-toast" aria-hidden="true"></div>

  <script>
    // ---- MCP connector synthetic thread ------------------------------------
    // Pinned at the bottom of the sidebar. On every page load, fetches the
    // tunnel URL published by start_all.sh and appends a new "utterance" to
    // a localStorage-backed history. Clicking the pinned thread renders that
    // history as a read-only conversation.

    const MCP_THREAD_ID = "__mcp_connector__";
    const MCP_HISTORY_KEY = "zorya.mcpHistory";
    const MCP_HISTORY_MAX = 10;

    function loadMcpHistory() {
      try { return JSON.parse(localStorage.getItem(MCP_HISTORY_KEY) || "[]"); }
      catch { return []; }
    }

    function saveMcpHistory(arr) {
      const trimmed = arr.slice(-MCP_HISTORY_MAX);
      localStorage.setItem(MCP_HISTORY_KEY, JSON.stringify(trimmed));
    }

    function pushMcpUtterance(url, online) {
      const arr = loadMcpHistory();
      arr.push({ ts: new Date().toISOString(), url, online });
      saveMcpHistory(arr);
    }

    function formatMcpTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, {
        month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit",
      });
    }

    async function initMcpThread() {
      try {
        const r = await fetch("/static/tunnel.json", { cache: "no-store" });
        if (r.ok) {
          const data = await r.json();
          if (data && data.public_url) {
            pushMcpUtterance(data.public_url, true);
            return;
          }
        }
      } catch (_) {}
      // No live tunnel this load; only record "offline" if we have prior history
      if (loadMcpHistory().length > 0) {
        pushMcpUtterance(null, false);
      }
    }

    const AGENT = "chat";
    const STORAGE_KEY = "zorya.currentThreadId";
    const BG_KEY = "zorya.background";
    const SIDEBAR_KEY = "zorya.sidebarCollapsed";

    // ---- background themes --------------------------------------------------

    const BG_THEMES = [
      { id: "aurora",  label: "Aurora"   },
      { id: "ember",   label: "Ember"    },
      { id: "forest",  label: "Forest"   },
      { id: "sunset",  label: "Sunset"   },
      { id: "deepsea", label: "Deep Sea" },
      { id: "dark",    label: "Dark"     },
    ];
    const BG_OVERRIDES = BG_THEMES.filter((t) => t.id !== "aurora").map((t) => `bg-${t.id}`);

    function applyBackground(themeId, showToast = false) {
      for (const cls of BG_OVERRIDES) document.body.classList.remove(cls);
      if (themeId !== "aurora") document.body.classList.add(`bg-${themeId}`);
      localStorage.setItem(BG_KEY, themeId);
      const theme = BG_THEMES.find((t) => t.id === themeId) ?? BG_THEMES[0];
      const btn = document.getElementById("bg-toggle");
      if (btn) btn.title = `Background: ${theme.label} — click to cycle`;
      if (showToast) {
        const toast = document.getElementById("bg-toast");
        if (toast) {
          toast.textContent = theme.label;
          toast.classList.add("show");
          clearTimeout(toast._timer);
          toast._timer = setTimeout(() => toast.classList.remove("show"), 1400);
        }
      }
    }

    function cycleBackground() {
      const current = localStorage.getItem(BG_KEY) || "aurora";
      const idx = BG_THEMES.findIndex((t) => t.id === current);
      const next = BG_THEMES[(idx + 1) % BG_THEMES.length];
      applyBackground(next.id, true);
    }

    applyBackground(localStorage.getItem(BG_KEY) || "aurora");
    document.getElementById("bg-toggle").addEventListener("click", cycleBackground);

    // ---- sidebar collapse --------------------------------------------------

    function applySidebarCollapsed(collapsed) {
      document.body.classList.toggle("sidebar-collapsed", collapsed);
      localStorage.setItem(SIDEBAR_KEY, collapsed ? "1" : "0");
    }

    applySidebarCollapsed(localStorage.getItem(SIDEBAR_KEY) === "1");
    document.getElementById("sidebar-toggle").addEventListener("click", () => applySidebarCollapsed(true));
    document.getElementById("sidebar-expand").addEventListener("click", () => applySidebarCollapsed(false));

    const logLeft = document.getElementById("log-left");
    const logRight = document.getElementById("log-right");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const modelSelect = document.getElementById("model");
    const visionModelSelect = document.getElementById("vision-model");
    const langSelect = document.getElementById("lang");
    const threadList = document.getElementById("thread-list");
    const newThreadBtn = document.getElementById("new-thread");
    const attachBtn = document.getElementById("attach-btn");
    const imageInput = document.getElementById("image-input");
    const imagePreview = document.getElementById("image-preview");
    const imagePreviewImg = document.getElementById("image-preview-img");
    const imageClear = document.getElementById("image-clear");

    // Curated list of Anthropic vision-capable models. Edit to add newer
    // releases (e.g. claude-sonnet-4-6, claude-opus-4-7) once your account
    // has them enabled.
    const VISION_MODELS = [
      { id: "claude-haiku-4-5",  label: "Claude Haiku 4.5" },
      { id: "claude-sonnet-4-5", label: "Claude Sonnet 4.5" },
      { id: "claude-opus-4-1",   label: "Claude Opus 4.1" },
    ];
    const DEFAULT_VISION_MODEL = "claude-sonnet-4-5";
    const MAX_IMAGE_BYTES = 20 * 1024 * 1024;

    /** @type {{role: "user"|"assistant", content: string, images: string[]}[]} */
    let history = [];
    let currentThreadId = localStorage.getItem(STORAGE_KEY) || null;
    let pendingImage = null;  // data URL of staged attachment, or null
    const translationCache = new Map();

    // ---- bubbles ------------------------------------------------------------

    function renderMarkdown(text) {
      if (!text) return "";
      if (typeof marked === "undefined" || typeof DOMPurify === "undefined") {
        const tmp = document.createElement("div");
        tmp.textContent = text;
        return tmp.innerHTML;
      }
      return DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
    }

    function setBubbleText(b, text) {
      if (b.role === "assistant") {
        b.content.innerHTML = renderMarkdown(text);
      } else {
        b.content.textContent = text;
      }
    }

    function bubble(log, role, text = "", images = []) {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      const r = document.createElement("span");
      r.className = "role";
      r.textContent = role;
      el.appendChild(r);
      for (const url of images || []) {
        const img = document.createElement("img");
        img.src = url;
        img.className = "msg-image";
        img.loading = "lazy";
        img.alt = "attachment";
        el.appendChild(img);
      }
      const c = document.createElement("div");
      c.className = "content";
      el.appendChild(c);
      log.appendChild(el);
      const b = { el, content: c, role };
      setBubbleText(b, text);
      log.scrollTop = log.scrollHeight;
      return b;
    }

    function showError(msg) {
      const e = document.createElement("div");
      e.className = "chat-error";
      e.textContent = msg;
      logLeft.appendChild(e);
      logLeft.scrollTop = logLeft.scrollHeight;
    }

    function clearLogs() {
      logLeft.innerHTML = "";
      logRight.innerHTML = "";
    }

    // ---- translation --------------------------------------------------------

    async function translate(text, target) {
      if (!text) return "";
      const key = `${target}::${text}`;
      if (translationCache.has(key)) return translationCache.get(key);
      const resp = await fetch("/api/translate", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text, target }),
      });
      if (!resp.ok) {
        const detail = await resp.text().catch(() => "");
        throw new Error(`HTTP ${resp.status}: ${detail}`);
      }
      const { translated } = await resp.json();
      translationCache.set(key, translated);
      return translated;
    }

    async function fillTranslated(bubbleObj, text, target) {
      bubbleObj.el.classList.add("streaming");
      try {
        setBubbleText(bubbleObj, await translate(text, target));
      } catch (err) {
        bubbleObj.content.textContent = `[translation error: ${err.message}]`;
        bubbleObj.el.classList.add("error");
      } finally {
        bubbleObj.el.classList.remove("streaming");
      }
    }

    async function retranslateAll() {
      logRight.innerHTML = "";
      const target = langSelect.value;
      for (const m of history) {
        const b = bubble(logRight, m.role, "", m.images || []);
        await fillTranslated(b, m.content, target);
      }
    }

    // ---- threads ------------------------------------------------------------

    function setCurrentThread(id) {
      currentThreadId = id;
      if (id) localStorage.setItem(STORAGE_KEY, id);
      else localStorage.removeItem(STORAGE_KEY);
      // Update active state across both the regular and pinned thread items
      for (const el of document.querySelectorAll(".thread-item, .thread-item-pinned")) {
        el.classList.toggle("active", el.dataset.threadId === id);
      }
      const isMcp = id === MCP_THREAD_ID;
      document.body.classList.toggle("mcp-thread-active", isMcp);
      input.placeholder = isMcp
        ? "Read-only system conversation"
        : "Type a message… (Enter to send, Shift+Enter for newline)";
    }

    // ---- MCP synthetic conversation rendering -----------------------------

    function renderMcpConversation() {
      clearLogs();
      history = [];
      const hist = loadMcpHistory();
      if (!hist.length) {
        bubble(logLeft, "assistant",
          "_No MCP tunnel URL has been published yet. Run `./start_all.sh` to start the tunnel._");
        return;
      }
      for (let i = 0; i < hist.length; i++) {
        const { ts, url, online } = hist[i];
        const isLast = i === hist.length - 1;
        const time = formatMcpTime(ts);
        let text;
        if (online && isLast) {
          text = `**Current MCP connector URL** _(updated ${time})_:\n\n\`${url}\`\n\nPaste this into **claude.ai → Settings → Connectors → Add custom connector**.`;
        } else if (online) {
          text = `_${time}_ — \`${url}\``;
        } else {
          text = `_${time}_ — tunnel offline (run \`./start_all.sh\` to bring it back up)`;
        }
        const b = bubble(logLeft, "assistant", text);
        if (online && isLast && url) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mcp-copy-btn";
          btn.textContent = "Copy URL";
          btn.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(url);
              btn.textContent = "Copied!";
              btn.classList.add("copied");
              setTimeout(() => { btn.textContent = "Copy URL"; btn.classList.remove("copied"); }, 1200);
            } catch (_) {}
          });
          b.content.appendChild(btn);
        }
      }
    }

    function renderMcpPinned() {
      const container = document.getElementById("thread-list-pinned");
      container.innerHTML = "";
      const hist = loadMcpHistory();
      if (!hist.length) {
        container.hidden = true;
        return;
      }
      const last = hist[hist.length - 1];
      container.hidden = false;

      const item = document.createElement("div");
      item.className = "thread-item-pinned";
      item.dataset.threadId = MCP_THREAD_ID;
      if (currentThreadId === MCP_THREAD_ID) item.classList.add("active");

      const icon = document.createElement("span");
      icon.className = "thread-pin-icon";
      icon.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 1 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 1 0 7.07 7.07l1.72-1.71"/></svg>`;
      item.appendChild(icon);

      const title = document.createElement("span");
      title.className = "thread-pin-title";
      title.textContent = "MCP Connector";
      item.appendChild(title);

      const status = document.createElement("span");
      status.className = "thread-pin-status " + (last.online ? "online" : "offline");
      status.textContent = last.online ? "online" : "offline";
      item.appendChild(status);

      item.addEventListener("click", () => loadThread(MCP_THREAD_ID));
      container.appendChild(item);
    }

    function renderThreadList(threads) {
      threadList.innerHTML = "";
      if (!threads.length) {
        const empty = document.createElement("div");
        empty.className = "thread-list-empty";
        empty.textContent = "No conversations yet.";
        threadList.appendChild(empty);
        return;
      }
      for (const t of threads) {
        const item = document.createElement("div");
        item.className = "thread-item";
        item.dataset.threadId = t.thread_id;
        if (t.thread_id === currentThreadId) item.classList.add("active");

        const title = document.createElement("span");
        title.className = "title";
        title.textContent = t.title || "(empty)";
        item.appendChild(title);

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "×";
        del.title = "Delete conversation";
        del.addEventListener("click", async (e) => {
          e.stopPropagation();
          if (!confirm(`Delete this conversation?\n\n"${t.title}"`)) return;
          await fetch(`/api/threads/${encodeURIComponent(t.thread_id)}`, { method: "DELETE" });
          if (t.thread_id === currentThreadId) {
            startNewThread();
          }
          await refreshThreads();
        });
        item.appendChild(del);

        item.addEventListener("click", () => loadThread(t.thread_id));
        threadList.appendChild(item);
      }
    }

    async function refreshThreads() {
      try {
        const resp = await fetch("/api/threads");
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const { threads } = await resp.json();
        renderThreadList(threads);
      } catch (err) {
        // non-fatal; sidebar just won't update
        console.error("refreshThreads failed", err);
      }
    }

    async function loadThread(threadId) {
      if (threadId === MCP_THREAD_ID) {
        setCurrentThread(MCP_THREAD_ID);
        renderMcpConversation();
        return;
      }
      try {
        const resp = await fetch(`/api/threads/${encodeURIComponent(threadId)}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const { messages } = await resp.json();
        history = messages.map((m) => ({
          role: m.role,
          content: m.content,
          images: m.images || [],
        }));
        setCurrentThread(threadId);
        clearLogs();
        for (const m of history) bubble(logLeft, m.role, m.content, m.images);
        await retranslateAll();
      } catch (err) {
        showError(`Could not load conversation: ${err.message}`);
      }
    }

    function startNewThread() {
      setCurrentThread(null);
      history = [];
      clearLogs();
      input.focus();
    }

    newThreadBtn.addEventListener("click", startNewThread);

    // ---- loaders ------------------------------------------------------------

    async function loadModels() {
      try {
        const resp = await fetch("/api/openai/models");
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const { models, default: defaultModel } = await resp.json();
        modelSelect.innerHTML = "";
        if (!models.length) {
          modelSelect.innerHTML = `<option>${defaultModel || "no models"}</option>`;
          return;
        }
        for (const m of models) {
          const opt = document.createElement("option");
          opt.value = m.id;
          opt.textContent = m.id;
          if (m.id === defaultModel) opt.selected = true;
          modelSelect.appendChild(opt);
        }
        modelSelect.disabled = false;
      } catch (err) {
        modelSelect.innerHTML = `<option value="gpt-4o-mini">gpt-4o-mini</option>`;
        modelSelect.disabled = false;
        showError(`Could not load model list: ${err.message}.`);
      }
    }

    function populateVisionModels() {
      visionModelSelect.innerHTML = "";
      for (const m of VISION_MODELS) {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = m.label;
        if (m.id === DEFAULT_VISION_MODEL) opt.selected = true;
        visionModelSelect.appendChild(opt);
      }
    }

    // ---- image attachment ---------------------------------------------------

    function clearPendingImage() {
      pendingImage = null;
      imageInput.value = "";
      imagePreviewImg.src = "";
      imagePreview.hidden = true;
    }

    function readAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    attachBtn.addEventListener("click", () => imageInput.click());

    imageInput.addEventListener("change", async () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) return;
      if (file.size > MAX_IMAGE_BYTES) {
        showError(`Image too large: ${(file.size / 1024 / 1024).toFixed(1)} MB (max 20 MB).`);
        imageInput.value = "";
        return;
      }
      try {
        pendingImage = await readAsDataURL(file);
        imagePreviewImg.src = pendingImage;
        imagePreview.hidden = false;
      } catch (err) {
        showError(`Could not read image: ${err.message || err}`);
        clearPendingImage();
      }
    });

    imageClear.addEventListener("click", clearPendingImage);

    async function loadLanguages() {
      try {
        const resp = await fetch("/api/translate/languages");
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const { languages } = await resp.json();
        const want = "ru";

        langSelect.innerHTML = "";
        let matched = null;
        for (const l of languages) {
          const opt = document.createElement("option");
          opt.value = l.code;
          opt.textContent = `${l.name} (${l.code})`;
          if (l.code === want) { opt.selected = true; matched = l.code; }
          langSelect.appendChild(opt);
        }
        if (!matched && languages.length) {
          langSelect.value = languages[0].code;
        }
        langSelect.disabled = false;
      } catch (err) {
        langSelect.innerHTML = `<option value="ru">Russian (ru)</option>`;
        langSelect.disabled = false;
        showError(`Could not load languages: ${err.message}.`);
      }
    }

    langSelect.addEventListener("change", retranslateAll);

    // ---- send flow ----------------------------------------------------------

    async function send(text) {
      if (!currentThreadId) {
        currentThreadId = (crypto.randomUUID && crypto.randomUUID()) || `t-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
        localStorage.setItem(STORAGE_KEY, currentThreadId);
      }
      const target = langSelect.value;
      const attachedImage = pendingImage;
      const isVision = !!attachedImage;
      const userImages = isVision ? [attachedImage] : [];

      clearPendingImage();

      history.push({ role: "user", content: text, images: userImages });
      bubble(logLeft, "user", text, userImages);
      const userRightBubble = bubble(logRight, "user", "", userImages);
      const userTranslate = fillTranslated(userRightBubble, text, target);

      const asstLeft = bubble(logLeft, "assistant", "");
      asstLeft.el.classList.add("streaming");
      let acc = "";

      sendBtn.disabled = true;
      const wasNewThread = history.length === 1;
      try {
        const body = {
          input: text,
          thread_id: currentThreadId,
          model: isVision ? visionModelSelect.value : modelSelect.value,
          provider: isVision ? "anthropic" : "openai",
        };
        if (isVision) body.images = [attachedImage];
        const resp = await fetch(`/api/agents/${AGENT}/stream?mode=messages`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const detail = await resp.text().catch(() => "");
          throw new Error(`HTTP ${resp.status}: ${detail}`);
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const events = buf.split("\n\n");
          buf = events.pop() ?? "";
          for (const ev of events) {
            const line = ev.split("\n").find((l) => l.startsWith("data: "));
            if (!line) continue;
            const data = line.slice(6);
            if (data === "[DONE]") continue;
            try {
              const payload = JSON.parse(data);
              if (payload.type === "token") {
                acc += payload.content;
                setBubbleText(asstLeft, acc);
                logLeft.scrollTop = logLeft.scrollHeight;
              } else if (payload.type === "error") {
                throw new Error(payload.error);
              }
            } catch (err) {
              if (err instanceof SyntaxError) continue;
              throw err;
            }
          }
        }

        history.push({ role: "assistant", content: acc, images: [] });
        asstLeft.el.classList.remove("streaming");

        const asstRight = bubble(logRight, "assistant", "", []);
        await fillTranslated(asstRight, acc, target);
      } catch (err) {
        showError(err.message || String(err));
        asstLeft.el.remove();
        userRightBubble.el.remove();
        history.pop();
        if (wasNewThread) {
          // roll back the new thread_id since the request failed
          currentThreadId = null;
          localStorage.removeItem(STORAGE_KEY);
        }
      } finally {
        asstLeft.el.classList.remove("streaming");
        sendBtn.disabled = false;
        input.focus();
      }

      await userTranslate;
      refreshThreads();  // updates title / new entry in sidebar
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (currentThreadId === MCP_THREAD_ID) return;  // read-only
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = "";
      send(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // ---- boot ---------------------------------------------------------------

    (async () => {
      populateVisionModels();
      await initMcpThread();  // emits a fresh utterance on each page load
      await Promise.all([loadModels(), loadLanguages(), refreshThreads()]);
      renderMcpPinned();
      if (currentThreadId) {
        await loadThread(currentThreadId).catch(() => startNewThread());
      }
    })();
  </script>
</body>
</html>
